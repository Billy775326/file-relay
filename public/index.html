<!doctype html>
<html lang="zh-CN" class="ui-enhanced ui-soft ui-send" data-ui-surface="index">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="分享文件或文本，生成 6 位取件口令。支持链接和扫码取件，可设置有效期与可取次数。">
<meta name="theme-color" content="#efe8d8">
<title data-i18n="doc.send">文件中转站 - 发送</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/ui.css">
<script>
  // 防 FOUC:渲染前定主题
  document.documentElement.dataset.theme =
    localStorage.getItem('theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
</head>
<body>
<div class="ui-header-band">
<header class="topbar wide ui-public-header">
  <div class="brand">
    <span class="logo">📦</span>
    <div><b data-i18n="brand.name">文件中转站</b><small data-i18n="brand.tagline">像取快递一样取文件</small></div>
  </div>
  <nav class="ui-public-nav" aria-label="发送与取件" data-i18n-aria="ui.publicNav">
    <a href="/" class="admin-nav-link" aria-current="page" data-i18n="nav.send">发送</a>
    <a href="/pickup" class="admin-nav-link" aria-current="false" data-i18n="nav.pickup">取件</a>
  </nav>
  <div class="actions">
    <button id="lang-btn" class="icon-btn lang-btn" data-i18n-title="nav.lang">EN</button>
    <button id="theme-btn" class="icon-btn" data-i18n-title="nav.theme">🌗</button>
  </div>
</header>
</div>

<main class="container wide">
  <div class="send-grid">
  <section class="card form-card">
    <div class="card-cap">
      <span data-i18n="send.cap">分享内容</span>
      <span class="cap-date" id="cap-date"></span>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="file" data-i18n="tab.file">发文件</button>
      <button class="tab" data-tab="text" data-i18n="tab.text">发文本</button>
    </div>

    <div id="panel-file" class="panel">
      <div id="dropzone" class="dropzone" tabindex="0" role="button" data-i18n-aria="dz.aria" aria-label="选择文件">
        <input type="file" id="file-input" multiple hidden>
        <div class="dz-icon">📄</div>
        <p><b data-i18n="dz.click">点击选择文件</b><span data-i18n="dz.drop">,或拖拽 / 粘贴到此处</span></p>
        <small id="dz-hint" data-i18n="dz.hint">上传后生成 6 位取件口令</small>
      </div>
      <div id="file-list" class="file-list" hidden></div>
    </div>

    <div id="panel-text" class="panel" hidden>
      <textarea id="text-input" rows="6" maxlength="65536" data-i18n-aria="tab.text" aria-label="发文本" data-i18n-ph="text.placeholder" placeholder="粘贴或输入要分享的文本…"></textarea>
      <div class="row-between"><small class="muted" id="text-counter">0 / 65536</small></div>
    </div>

    <details class="upload-context" open>
      <summary><span data-i18n="context.add">补充信息（选填）</span><small data-i18n="context.visibility">补充信息仅管理员可见</small></summary>
      <div class="context-fields">
        <div class="context-row">
          <label for="upload-name" data-i18n="context.name">怎么称呼你</label>
          <input id="upload-name" type="text" maxlength="40" autocomplete="nickname" data-i18n-ph="context.namePh" placeholder="填写你常用的称呼">
        </div>
        <div id="upload-description-field" class="context-row">
          <div class="context-label"><label for="upload-description" data-i18n="context.description">文件说明</label><small id="description-count" class="muted">0 / 300</small></div>
          <textarea id="upload-description" rows="2" maxlength="300" aria-describedby="description-count" data-i18n-ph="context.descriptionPh" placeholder="简述文件内容，同批文件共用"></textarea>
        </div>
      </div>
    </details>

    <div class="options">
      <div class="opt-group">
        <label data-i18n="opt.expiry">有效期</label>
        <div class="seg" id="seg-expiry" role="group" data-i18n-aria="opt.expiry" aria-label="有效期">
          <button type="button" data-v="1d" data-i18n="seg.1d">1 天</button>
          <button type="button" data-v="7d" class="active" data-i18n="seg.7d">7 天</button>
          <button type="button" data-v="30d" data-i18n="seg.30d">30 天</button>
          <button type="button" data-v="forever" data-i18n="seg.forever" disabled>永久</button>
        </div>
      </div>
      <div class="opt-group">
        <label data-i18n="opt.pickups">可取次数</label>
        <div class="seg" id="seg-pickups" role="group" data-i18n-aria="opt.pickups" aria-label="可取次数">
          <button type="button" data-v="1" data-i18n="seg.p1">1 次</button>
          <button type="button" data-v="5" class="active" data-i18n="seg.p5">5 次</button>
          <button type="button" data-v="null" data-i18n="seg.punlimited" disabled>不限</button>
        </div>
      </div>
    </div>

    <small id="upload-policy-hint" class="muted" aria-live="polite"></small>
    <button id="btn-upload" class="btn primary block" disabled data-i18n="btn.upload">开始上传</button>
    <button id="btn-text" class="btn primary block" hidden disabled data-i18n="btn.genCode">生成口令</button>


    <div id="progress" class="progress" hidden>
      <div class="bar"><div id="progress-fill"></div></div>
      <div class="row-between">
        <small id="progress-text">…</small>
        <button id="btn-cancel" class="btn danger small" type="button" data-i18n="btn.cancel">取消</button>
      </div>
    </div>

    </section>

    <aside class="send-side">
      <div class="side-cap" data-i18n="receipt.cap">分享结果</div>
      <div id="result-placeholder" class="result-placeholder">
        <div class="ph-postmark">READY</div>
        <p data-i18n="ph.title">等待分享</p>
        <small data-i18n="ph.sub">分享成功后，在这里复制口令或链接</small>
        <div class="ph-route">
          <div class="ph-leg"><span class="ph-ic">🧑</span><div><b data-i18n="route.senderT">寄件人 · 你</b><small data-i18n="route.senderS">选择内容，设置有效期和可取次数</small></div></div>
          <div class="ph-dash"></div>
          <div class="ph-leg"><span class="ph-ic">☁️</span><div><b data-i18n="route.relayT">生成分享</b><small data-i18n="route.relayS">把取件口令或链接发给对方</small></div></div>
          <div class="ph-dash"></div>
          <div class="ph-leg"><span class="ph-ic">🧲</span><div><b data-i18n="route.takerT">取件人 · 对方</b><small data-i18n="route.takerS">输入口令或打开链接，即可取件</small></div></div>
        </div>
        <div class="ph-fine" data-i18n="route.fine">口令请妥善保管，仅分享给需要的人</div>
      </div>
      <div id="results" class="results"></div>
    </aside>
  </div>
</main>

<footer class="foot ui-send-footer">
  <div class="ui-footer-inner">
    <div class="ui-footer-about"><small data-i18n="ui.footerAbout">见字如面，让分享简单一点。</small></div>
    <nav class="ui-footer-links" aria-label="页尾导航" data-i18n-aria="ui.footerNav">
      <button id="ui-send-help" class="ui-footer-link" type="button" data-i18n="ui.help">使用帮助</button>
      <a class="ui-footer-link" href="/pickup" data-i18n="ui.toPickup">前往取件</a>
    </nav>
    <div class="ui-footer-contact"><a href="mailto:iblykk@gmail.com" data-i18n="ad.contact">联系站长</a></div>
  </div>
</footer>

<script type="module" src="/js/index.js"></script>
</body>
</html>
