<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="自托管文件/文本分享:上传生成 6 位取件口令,像取快递一样取件">
<meta name="theme-color" content="#f6f7fb">
<title data-i18n="doc.send">文件中转站 - 发送</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="stylesheet" href="/style.css">
<script>
  // 防 FOUC:渲染前定主题
  document.documentElement.dataset.theme =
    localStorage.getItem('theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">📦</span>
    <div><b data-i18n="brand.name">文件中转站</b><small data-i18n="brand.tagline">像取快递一样取文件</small></div>
  </div>
  <div class="actions">
    <button id="lang-btn" class="icon-btn lang-btn" data-i18n-title="nav.lang">EN</button>
    <button id="theme-btn" class="icon-btn" data-i18n-title="nav.theme">🌗</button>
    <a class="btn ghost small" href="/pickup" data-i18n="nav.pickup">取件</a>
  </div>
</header>

<main class="container">
  <section class="card">
    <div class="tabs">
      <button class="tab active" data-tab="file" data-i18n="tab.file">发文件</button>
      <button class="tab" data-tab="text" data-i18n="tab.text">发文本</button>
    </div>

    <div id="panel-file" class="panel">
      <div id="dropzone" class="dropzone" tabindex="0" role="button" data-i18n-aria="dz.aria" aria-label="选择文件">
        <input type="file" id="file-input" multiple hidden>
        <div class="dz-icon">📄</div>
        <p><b data-i18n="dz.click">点击选择文件</b><span data-i18n="dz.drop">,或拖拽 / 粘贴到此处</span></p>
        <small id="dz-hint" data-i18n="dz.hint">上传后生成 6 位取件口令</small>
      </div>
      <div id="file-list" class="file-list" hidden></div>
    </div>

    <div id="panel-text" class="panel" hidden>
      <textarea id="text-input" rows="6" maxlength="65536" data-i18n-ph="text.placeholder" placeholder="粘贴或输入要分享的文本…"></textarea>
      <div class="row-between"><small class="muted" id="text-counter">0 / 65536</small></div>
    </div>

    <div class="options">
      <div class="opt-group">
        <label data-i18n="opt.expiry">有效期</label>
        <div class="seg" id="seg-expiry">
          <button type="button" data-v="1d" data-i18n="seg.1d">1 天</button>
          <button type="button" data-v="7d" class="active" data-i18n="seg.7d">7 天</button>
          <button type="button" data-v="30d" data-i18n="seg.30d">30 天</button>
          <button type="button" data-v="forever" data-i18n="seg.forever">永久</button>
        </div>
      </div>
      <div class="opt-group">
        <label data-i18n="opt.pickups">可取次数</label>
        <div class="seg" id="seg-pickups">
          <button type="button" data-v="1" data-i18n="seg.p1">1 次</button>
          <button type="button" data-v="5" data-i18n="seg.p5">5 次</button>
          <button type="button" data-v="null" class="active" data-i18n="seg.punlimited">不限</button>
        </div>
      </div>
    </div>

    <button id="btn-upload" class="btn primary block" disabled data-i18n="btn.upload">开始上传</button>
    <button id="btn-text" class="btn primary block" hidden disabled data-i18n="btn.genCode">生成口令</button>

    <div id="progress" class="progress" hidden>
      <div class="bar"><div id="progress-fill"></div></div>
      <div class="row-between">
        <small id="progress-text">…</small>
        <button id="btn-cancel" class="btn danger small" type="button" data-i18n="btn.cancel">取消</button>
      </div>
    </div>

    <div id="results" class="results"></div>
  </section>
</main>

<footer class="foot" data-i18n="foot">自托管 · 运行于 Cloudflare Workers</footer>

<script src="/js/vendor/qrcode.js"></script>
<script type="module" src="/js/index.js"></script>
</body>
</html>
