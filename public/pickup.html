<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="输入 6 位取件口令,取出分享给你的文件或文本">
<meta name="theme-color" content="#efe8d8">
<title data-i18n="doc.pickup">文件中转站 - 取件</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="stylesheet" href="/style.css">
<script>
  document.documentElement.dataset.theme =
    localStorage.getItem('theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">📦</span>
    <div><b data-i18n="brand.name">文件中转站</b><small data-i18n="brand.pickup">取件</small></div>
  </div>
  <div class="actions">
    <button id="lang-btn" class="icon-btn lang-btn" data-i18n-title="nav.lang">EN</button>
    <button id="theme-btn" class="icon-btn" data-i18n-title="nav.theme">🌗</button>
    <a class="btn ghost small" href="/" data-i18n="nav.send">发送</a>
  </div>
</header>

<main class="container narrow">
  <section class="card center" id="pickup-input-card">
    <h2 class="title" data-i18n="pk.title">输入取件口令</h2>
    <p class="muted pk-sub" data-i18n="pk.sub">输入 6 位数字口令,取出分享的文件或文本</p>
    <div id="otp-row" class="otp-row" role="group" data-i18n-aria="pk.aria" aria-label="6 位取件口令">
      <input class="otp-box" inputmode="numeric" autocomplete="one-time-code" maxlength="1" autofocus>
      <input class="otp-box" inputmode="numeric" autocomplete="one-time-code" maxlength="1">
      <input class="otp-box" inputmode="numeric" autocomplete="one-time-code" maxlength="1">
      <input class="otp-box" inputmode="numeric" autocomplete="one-time-code" maxlength="1">
      <input class="otp-box" inputmode="numeric" autocomplete="one-time-code" maxlength="1">
      <input class="otp-box" inputmode="numeric" autocomplete="one-time-code" maxlength="1">
    </div>
    <div id="pickup-error" class="error-box" hidden></div>
  </section>

  <section class="card" id="pickup-result" hidden></section>
</main>

<footer class="foot" data-i18n="foot">见字如面</footer>

<script type="module" src="/js/pickup.js"></script>
</body>
</html>
