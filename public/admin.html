<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件中转站 - 管理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="stylesheet" href="/style.css">
<script>
  document.documentElement.dataset.theme =
    localStorage.getItem('theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
</head>
<body>
<header class="topbar wide">
  <div class="brand">
    <span class="logo">📦</span>
    <div><b>文件中转站</b><small>管理后台</small></div>
  </div>
  <div class="actions">
    <button id="theme-btn" class="icon-btn" title="切换主题">🌗</button>
    <a class="btn ghost small" href="/">发送</a>
  </div>
</header>

<main class="container wide">
  <section class="card center" id="admin-login" hidden>
    <h2 class="title">管理登录</h2>
    <p class="muted" style="margin:0">输入部署时设置的管理令牌(ADMIN_TOKEN)</p>
    <input id="admin-token" class="token-input" type="password" placeholder="管理令牌" autocomplete="current-password">
    <button id="btn-login" class="btn primary block">登录</button>
    <div id="login-error" class="error-box" hidden></div>
  </section>

  <section id="admin-panel" hidden>
    <div class="stats-row" id="stats-row"></div>
    <div class="card" style="padding:14px">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>口令</th><th>类型</th><th>内容</th><th>大小</th>
              <th>已取/上限</th><th>过期时间</th><th>状态</th><th>创建时间</th><th></th>
            </tr>
          </thead>
          <tbody id="shares-body"></tbody>
        </table>
      </div>
      <div class="row-between">
        <button id="btn-prev" class="btn small" disabled>上一页</button>
        <small class="muted" id="page-info"></small>
        <button id="btn-next" class="btn small" disabled>下一页</button>
      </div>
      <div class="admin-foot">
        <button id="btn-logout" class="btn ghost small">退出登录</button>
      </div>
    </div>
  </section>
</main>

<script type="module" src="/js/admin.js"></script>
</body>
</html>
