<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="文件中转站管理后台">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#efe8d8">
<title data-i18n="doc.admin">文件中转站 - 管理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="stylesheet" href="/style.css">
<script>
  document.documentElement.dataset.theme =
    localStorage.getItem('theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
</head>
<body>
<header class="topbar wide">
  <div class="brand">
    <span class="logo">📦</span>
    <div><b data-i18n="brand.name">文件中转站</b><small data-i18n="brand.admin">管理后台</small></div>
  </div>
  <div class="actions">
    <button id="lang-btn" class="icon-btn lang-btn" data-i18n-title="nav.lang">EN</button>
    <button id="theme-btn" class="icon-btn" data-i18n-title="nav.theme">🌗</button>
    <a class="btn ghost small" href="/" target="_blank" rel="noopener noreferrer" data-i18n="nav.send">发送</a>
  </div>
</header>

<main class="container wide">
  <section class="card center" id="admin-login" hidden>
    <h2 class="title" data-i18n="ad.loginTitle">管理登录</h2>
    <p class="muted" style="margin:0" data-i18n="ad.loginSub">输入部署时设置的管理令牌(ADMIN_TOKEN)</p>
    <input id="admin-token" class="token-input" type="password" data-i18n-ph="ad.tokenPh" placeholder="管理令牌" autocomplete="current-password">
    <button id="btn-login" class="btn primary block" data-i18n="ad.login">登录</button>
    <div id="login-error" class="error-box" hidden></div>
  </section>

  <section id="admin-panel" hidden>
    <div class="stats-row" id="stats-row"></div>
    <div class="card" style="padding:14px">
      <div class="retention-settings">
        <form id="retention-form">
          <label for="retention-days" data-i18n="ad.retentionDays">过期后保留</label>
          <input id="retention-days" type="number" min="0" max="3650" step="1" required disabled>
          <span data-i18n="ad.days">天</span>
          <button id="retention-save" class="btn small" type="submit" disabled data-i18n="ad.save">保存</button>
        </form>
        <p id="retention-error" class="error-box" hidden role="alert"></p>
        <button id="retention-retry" class="btn small ghost" type="button" hidden data-i18n="ad.retry">重试</button>
      </div>
      <details class="guest-settings">
        <summary data-i18n="ad.guestLimits">未备注访客限制</summary>
        <form id="guest-policy-form">
          <label><span data-i18n="ad.weeklyFiles">每周文件数</span><input id="guest-weekly" type="number" min="0" max="1000" step="1" required disabled></label>
          <label><span data-i18n="ad.guestSize">单文件上限（MB）</span><input id="guest-size" type="number" min="1" max="9900" step="1" required disabled></label>
          <button id="guest-save" class="btn small" type="submit" disabled data-i18n="ad.save">保存</button>
        </form>
        <small class="muted" data-i18n="ad.guestRules">北京时间周一重置；已接纳上传计次，取消不退回。未备注访客不能永久分享或不限次取件。</small>
        <p id="guest-error" class="error-box" hidden role="alert"></p>
        <button id="guest-retry" class="btn small ghost" type="button" hidden data-i18n="ad.retry">重试</button>
      </details>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="ad.th.code">口令</th><th data-i18n="ad.th.content">内容</th><th data-i18n="ad.source">上传来源</th><th data-i18n="ad.th.size">大小</th>
              <th data-i18n="ad.th.pickups">已取/上限</th><th data-i18n="ad.th.expire">过期时间</th><th data-i18n="ad.th.status">状态</th><th data-i18n="ad.th.created">创建时间</th><th></th>
            </tr>
          </thead>
          <tbody id="shares-body"></tbody>
        </table>
      </div>
      <div class="row-between admin-pager">
        <div class="pager-btns">
          <button id="btn-prev" class="btn small" disabled data-i18n="ad.prev">上一页</button>
          <button id="btn-next" class="btn small" disabled data-i18n="ad.next">下一页</button>
        </div>
        <small class="muted" id="page-info"></small>
        <button id="btn-refresh" class="btn small ghost" data-i18n="ad.refresh">↻ 刷新</button>
      </div>
      <div class="admin-foot">
        <button id="btn-logout" class="btn ghost small" data-i18n="ad.logout">退出登录</button>
      </div>
    </div>
  </section>
</main>

<!-- 作废确认弹窗:票据风,替代原生 confirm(ESC / 点遮罩 = 取消) -->
<div class="modal-mask" id="del-mask" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="del-title">
    <h3 class="modal-title" id="del-title" data-i18n="ad.delTitle">作废这张取件凭证?</h3>
    <div class="del-target" id="del-target"></div>
    <p class="del-warn" data-i18n="ad.delWarn">作废后口令立即失效,对方将无法取件,且不可恢复。</p>
    <div class="modal-actions">
      <button id="del-cancel" class="btn" data-i18n="btn.cancel">取消</button>
      <button id="del-ok" class="btn danger" data-i18n="ad.delOk">确认作废</button>
    </div>
  </div>
</div>

<dialog id="source-dialog" class="source-dialog" aria-labelledby="source-title">
  <div class="source-heading">
    <h3 id="source-title" tabindex="-1" autofocus data-i18n="ad.source">上传来源</h3>
    <small id="source-context" class="muted mono"></small>
  </div>
  <div class="source-body">
    <div id="source-detail" aria-live="polite"></div>
    <form id="source-form" hidden>
      <label for="source-note" data-i18n="ad.sourceNote">管理员备注</label>
      <input id="source-note" type="text" maxlength="64" autocomplete="off">
      <small class="muted" data-i18n="ad.notePrivileges">备注后免除访客上传限制，并允许永久、不限次分享；清空备注恢复限制。</small>
      <p class="error-box" id="source-error" hidden role="alert"></p>
    </form>
  </div>
  <div class="source-footer">
    <button id="source-close" class="btn ghost" type="button" data-i18n="ad.sourceClose">关闭</button>
    <button id="source-save" class="btn primary" type="submit" form="source-form" hidden data-i18n="ad.sourceSave">保存备注</button>
  </div>
</dialog>
<dialog id="file-dialog" class="source-dialog" aria-labelledby="file-title">
  <div class="source-heading">
    <h3 id="file-title" tabindex="-1" autofocus data-i18n="ad.fileDetails">文件详情</h3>
    <small id="file-context" class="muted mono"></small>
  </div>
  <div class="source-body">
    <div id="file-detail" class="file-detail-grid" aria-live="polite"></div>
  </div>
  <div class="source-footer">
    <button id="file-close" class="btn ghost" type="button" data-i18n="ad.sourceClose">关闭</button>
    <a id="file-download" class="btn primary" target="_blank" rel="noopener noreferrer" hidden data-i18n="ad.download">下载</a>
  </div>
</dialog>
<script type="module" src="/js/admin.js"></script>
</body>
</html>
